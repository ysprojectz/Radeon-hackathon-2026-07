apisix:
  node_listen: 9080
  enable_ipv6: false
  enable_admin: true
  admin_listen:
    ip: 0.0.0.0
    port: 9180
  admin_key:
    - name: admin
      # No default — APISIX_ADMIN_KEY must be set explicitly before this
      # service starts. The APISIX-documented example key was previously
      # hardcoded here as a fallback, which would grant full Admin API
      # access to anyone who knows it if the env var was ever left unset.
      key: ${APISIX_ADMIN_KEY:-CHANGE-ME-generate-a-real-key-before-deploy}
      role: admin

deployment:
  role: traditional
  role_traditional:
    config_provider: yaml

plugin_attr:
  jwt-auth:
    exp: 1800
