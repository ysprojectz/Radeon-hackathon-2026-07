[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    unit: Fast dependency-light unit tests.
    integration: Tests that require a live app, database, or network-adjacent service.
    slow: Long-running tests or broad end-to-end checks.
    security: Security, secrets, auth, or boundary tests.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
